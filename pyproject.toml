[project]
name = "spark-wildfire"
version = "0.1.0"
description = "Acoustic wildfire kinematics: fire spread simulation and inverse source localization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["data", "results"]
force-exclude = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "ANN",
    "B",
    "SIM",
    "PT",
    "NPY",
    "RUF",
]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["E402"]
"src/spark/fire/rate_of_spread_equations.py" = ["RUF001", "RUF002", "RUF003"]
"src/utils/io/metrics_writer.py" = ["ANN401"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts", "main.py"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["scipy.*", "soundfile.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true