[project]
name = "spark-wildfire"
version = "0.1.0"
description = "Acoustic wildfire kinematics: fire spread simulation and inverse source localization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
