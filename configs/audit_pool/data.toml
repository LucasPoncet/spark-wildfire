[recording]
path = "data/raw_recordings/kaggle/videoplayback_01.wav"
as_mono = true

[segmentation]
clip_duration_s = 50.0
overlap_fraction = 0.0

[output]
metrics_directory = "results/metrics"
metrics_filename = "multi_source_localization.json"

[excerpts]
recording_directory = "data/raw_recordings/kaggle"
recording_filenames = []
assignment_policy = "distinct_provenance"
# 0.15 is the target. This pool cannot meet it at a 50 s excerpt length: every
# one of its 190 pairs measures at least 0.478, because the twenty files are
# overlapping cuts of one continuous recording. 0.50 is the measured floor of
# this pool, recorded here so the run proceeds with the limitation stated rather
# than hidden. Run scripts/run_source_excerpt_audit.py to reproduce the matrix.
maximum_permitted_excerpt_coherence = 0.50
selection_seed = 0
