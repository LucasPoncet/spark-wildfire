[recording]
path = "data/raw_recordings/kaggle/videoplayback_01.wav"
as_mono = true

[segmentation]
clip_duration_s = 50.0
overlap_fraction = 0.0

[output]
metrics_directory = "results/metrics"
metrics_filename = "multi_source_localization.json"

[excerpts]
recording_directory = "data/raw_recordings/kaggle"
recording_filenames = [
    "videoplayback_02.wav",
    "videoplayback (1)_02.wav",
]
assignment_policy = "explicit"
# Two excerpts from different recording provenances, which measure 0.026
# apart. This scene is about a power disparity and nothing else, so its
# excerpts are decorrelated outright rather than at what one provenance
# allows. Naming them keeps the run fast: minimum_coherence over the sixty
# file pool is a tens-of-minutes search that belongs in the audit.
maximum_permitted_excerpt_coherence = 0.15
selection_seed = 0
