assignment_policy = "explicit"
# Twenty non-overlapping 2.5 s windows, mutually decorrelated to 0.137, found
# once by a greedy minimum-coherence search over the 280 windows the fourteen
# named recordings yield. They are listed rather than searched for because
# that search costs about ten minutes and would otherwise be repeated on
# every run of every sweep cell. The order is the order the search chose, so
# the first ten and the first fifteen are themselves the least coherent
# subsets of their size: 0.121 at ten, 0.132 at fifteen, 0.137 at twenty.
#
# 2.5 s rather than 5 s because twenty windows do not decorrelate at 5 s: the
# best subset of twenty measures 0.175 there, outside the target. The cost is
# about nine accumulation windows per correlation.
maximum_permitted_excerpt_coherence = 0.15
selection_seed = 0
