[domain]
size_x_m = 100.0
size_y_m = 100.0

[receivers]
layout = "ring"
count = 20
ring_radius_m = 45.0
ring_start_bearing_rad = 0.0
center_x_fraction = 0.5
center_y_fraction = 0.5
grid_spacing_m = 20.0
random_radius_m = 45.0
random_seed = 0
minimum_separation_m = 5.0
maximum_collinearity = 0.98
height_m = 1.5
positions_xy_m = [[30.0, 0.0], [70.0, 0.0]]

# Twenty sources scattered around a circle of radius 10 m about the domain
# centre, staying within 3 m of it, so they sit at radii 7.4 to 12.9 m. The
# centre is (50, 50) rather than the origin because the candidate grid and the
# receiver layout are both built on [0, extent]: a circle about (0, 0) would put
# three quarters of the sources outside the region the estimator can search.
#
# Ordered farthest-point first, so any prefix stays spread around the ring.
# Closest pair by prefix: 4.11 m at ten sources, 3.59 m at fifteen,
# 2.66 m at twenty.
[sources]
true_positions_xy_m = [
    [39.05, 45.47],
    [59.46, 56.46],
